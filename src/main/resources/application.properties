spring.application.name=VideoScale

# MinIO
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=videos

# Uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Fail fast when the broker is unreachable instead of blocking 60s+ in send()
spring.kafka.producer.properties.max.block.ms=5000

# Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.group-id=video-worker-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
# Transcoding one video takes minutes; default 5min poll interval evicts the
# consumer mid-job and the message gets redelivered (duplicate work)
spring.kafka.consumer.properties.max.poll.interval.ms=1800000
spring.kafka.consumer.properties.max.poll.records=1
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=videoJob:com.example.VideoScale.dto.VideoJobMessage

# Custom topic
spring.kafka.topic.video-processing=video-processing-topic


# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/videoscale
spring.datasource.username=videoscale
spring.datasource.password=videoscale123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600